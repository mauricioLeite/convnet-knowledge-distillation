services:
  kd-lab:
    build:
      context: .
      dockerfile: Dockerfile
    image: mo434-kd:latest
    container_name: mo434-kd
    # GPU access (requires nvidia-container-toolkit on host)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8888:8888"
    volumes:
      - ./src:/workspace/src
      - ./notebooks:/workspace/notebooks
      - ./outputs:/workspace/outputs
      - ./data:/workspace/data
      - ./checkpoints:/workspace/checkpoints
      - ./results:/workspace/results
      - model-cache:/root/.cache
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
      - TORCH_HOME=/root/.cache/torch
      - HF_HOME=/root/.cache/huggingface
    shm_size: "16g"
    stdin_open: true
    tty: true
    restart: unless-stopped
    command:
      - bash
      - -lc
      - |
        python - <<'PY'
        import torch
        bar = '=' * 60
        print(bar)
        print('MO434 Knowledge Distillation Lab')
        print('PyTorch :', torch.__version__)
        print('CUDA    :', torch.version.cuda, '| available:', torch.cuda.is_available())
        print('GPU     :', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'CPU only')
        print(bar)
        PY
        exec jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --notebook-dir=/workspace

volumes:
  model-cache:
