services:
  kd-lab:
    build:
      # Root context so the Dockerfile can COPY pyproject.toml / uv.lock.
      context: ..
      dockerfile: .devcontainer/Dockerfile
    image: mo434-kd:latest
    container_name: mo434-kd
    # GPU access (requires nvidia-container-toolkit on host)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8888:8888"
    volumes:
      # Mount the whole project root (compose file lives in .devcontainer/, so
      # `..` is the repo root). Exposes src/notebooks/outputs/data + the
      # *_pets.pth checkpoints and pyproject the training reads.
      - ..:/workspace
      - model-cache:/root/.cache
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
      - TORCH_HOME=/root/.cache/torch
      - HF_HOME=/root/.cache/huggingface
    shm_size: "16g"
    stdin_open: true
    tty: true
    restart: unless-stopped
    command:
      - bash
      - -lc
      - |
        /opt/venv/bin/python - <<'PY'
        import torch
        bar = '=' * 60
        print(bar)
        print('MO434 Knowledge Distillation Lab')
        print('PyTorch :', torch.__version__)
        print('CUDA    :', torch.version.cuda, '| available:', torch.cuda.is_available())
        print('GPU     :', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'CPU only')
        print(bar)
        PY
        exec /opt/venv/bin/jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --notebook-dir=/workspace

volumes:
  model-cache:
